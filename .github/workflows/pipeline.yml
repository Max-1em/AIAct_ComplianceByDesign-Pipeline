name: AI Act ComplianceByDesign Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: aiacbd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  ARTIFACT_DIR: artifacts
  DOCS_DIR: docs

jobs:
  # ---------------------------------------------------------------------------
  # Bootstrap (Checkout, Python, Cache, Deps) – wird von allen Stages benötigt
  # ---------------------------------------------------------------------------
  setup:
    name: Setup & Dependencies
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.meta.outputs.sha }}
      build_id: ${{ steps.meta.outputs.runid }}
      build_time: ${{ steps.meta.outputs.time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare folders
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          mkdir -p "${DOCS_DIR}"

      - name: Collect build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "runid=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # -----------------------------
  # Stage 1 – Setup & Traceability
  # -----------------------------
  stage_1:
    name: 1) Setup & Traceability
    runs-on: ubuntu-latest
    needs: [ setup ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate VERSION_MANIFEST.json
        env:
          BUILD_SHA: ${{ needs.setup.outputs.build_sha }}
          BUILD_ID: ${{ needs.setup.outputs.build_id }}
          BUILD_TIME: ${{ needs.setup.outputs.build_time }}
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          cat > "${ARTIFACT_DIR}/VERSION_MANIFEST.json" << 'JSON'
          {
            "build_id": "${BUILD_ID}",
            "git_sha": "${BUILD_SHA}",
            "timestamp": "${BUILD_TIME}"
          }
          JSON
      - name: Upload Stage 1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage1-setup-traceability
          path: |
            ${ARTIFACT_DIR}/VERSION_MANIFEST.json

  # ------------------------------------------------------
  # Stage 2 – Risikoklasse & Technische Dokumentation
  # ------------------------------------------------------
  stage_2:
    name: 2) Risk Class & Tech Docs
    runs-on: ubuntu-latest
    needs: [ stage_1 ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate risk and technical docs
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          # Falls vorhanden, eigenes Skript nutzen:
          if [ -f generate_docs.py ]; then
            python generate_docs.py --out "${ARTIFACT_DIR}"
          else
            # Platzhalter – bitte durch echte Generatoren ersetzen
            cat > "${ARTIFACT_DIR}/risk_classification.md" << 'MD'
            # Risk Classification
            - Category: High-Risk (placeholder)
            - Justification: ...
            MD
            cat > "${ARTIFACT_DIR}/technical_documentation.md" << 'MD'
            # Technical Documentation
            - System overview, data lineage, interfaces, configs (placeholder)
            MD
          fi
      - name: Upload Stage 2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage2-risk-techdocs
          path: |
            ${ARTIFACT_DIR}/risk_classification.md
            ${ARTIFACT_DIR}/technical_documentation.md

  # ---------------------------------
  # Stage 3a – Risk Management Log
  # ---------------------------------
  stage_3a:
    name: 3a) Risk Management Log
    runs-on: ubuntu-latest
    needs: [ stage_2 ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate risk management log
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          cat > "${ARTIFACT_DIR}/risk_management_log.md" << 'MD'
          # Risk Management Log
          - Identified risks, mitigations, owners, dates (placeholder)
          MD
      - name: Upload Stage 3a artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage3a-risk-log
          path: ${ARTIFACT_DIR}/risk_management_log.md

  # ---------------------------------
  # Stage 3b – Bias & Fairness Check
  # ---------------------------------
  stage_3b:
    name: 3b) Bias & Fairness Check
    runs-on: ubuntu-latest
    needs: [ stage_3a ]
    steps:
      - uses: actions/checkout@v4
      - name: Run training & tests (optional)
        run: |
          # Beispiel: Train & Test falls Skripte existieren
          if [ -f train.py ]; then python train.py; fi
          if [ -f test_model.py ]; then python test_model.py; fi
      - name: Bias analysis
        id: bias
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          # Beispielhafte Bias-Prüfung (Platzhalter-Logik)
          # Setze FAIL=1, um das Verhalten zu testen
          FAIL=0

          # Erzeuge JSON-Report
          cat > "${ARTIFACT_DIR}/bias_report.json" << JSON
          {
            "checks": [
              {"name": "demographic_parity", "p_value": 0.14, "passed": true},
              {"name": "equal_opportunity", "p_value": 0.07, "passed": true}
            ],
            "overall_passed": $([ $FAIL -eq 0 ] && echo true || echo false)
          }
          JSON

          # Erzeuge MD-Report
          cat > "${ARTIFACT_DIR}/bias_report.md" << MD
          # Bias & Fairness Report
          - Demographic Parity: pass
          - Equal Opportunity: pass
          - Overall: $([ $FAIL -eq 0 ] && echo PASS || echo FAIL)
          MD

          echo "fail=${FAIL}" >> "$GITHUB_OUTPUT"

      - name: Fail if bias check failed
        if: steps.bias.outputs.fail == '1'
        run: |
          echo "Bias check failed – stopping pipeline as required."
          exit 1

      - name: Upload Stage 3b artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-bias-fairness
          path: |
            ${ARTIFACT_DIR}/bias_report.json
            ${ARTIFACT_DIR}/bias_report.md

  # -----------------------------
  # Stage 4 – Human Oversight Plan
  # -----------------------------
  stage_4:
    name: 4) Human Oversight Plan
    runs-on: ubuntu-latest
    needs: [ stage_3b ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate human oversight plan
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          cat > "${ARTIFACT_DIR}/human_oversight_plan.md" << 'MD'
          # Human Oversight Plan
          - Interventions, escalation paths, review cadence (placeholder)
          MD
      - name: Upload Stage 4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage4-human-oversight
          path: ${ARTIFACT_DIR}/human_oversight_plan.md

  # -------------------------------
  # Stage 5 – Logging & Monitoring
  # -------------------------------
  stage_5:
    name: 5) Logging & Monitoring
    runs-on: ubuntu-latest
    needs: [ stage_4 ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate logging & monitoring concept
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          cat > "${ARTIFACT_DIR}/logging_monitoring_concept.md" << 'MD'
          # Logging & Monitoring Concept
          - Metrics, alerting, retention, tamper-proofing (placeholder)
          MD
      - name: Upload Stage 5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage5-logging-monitoring
          path: ${ARTIFACT_DIR}/logging_monitoring_concept.md

  # --------------------------------------------
  # Stage 6 – Model Card & Dataset Card
  # --------------------------------------------
  stage_6:
    name: 6) Model Card & Dataset Card
    runs-on: ubuntu-latest
    needs: [ stage_5 ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate model & dataset cards
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          if [ -f generate_docs.py ]; then
            # Beispiel: Skript erzeugt beide Karten
            python generate_docs.py --cards --out "${ARTIFACT_DIR}"
          else
            cat > "${ARTIFACT_DIR}/model_card.md" << 'MD'
            # Model Card
            - Intended use, performance, limitations (placeholder)
            MD
            cat > "${ARTIFACT_DIR}/dataset_card.md" << 'MD'
            # Dataset Card
            - Composition, collection process, ethical considerations (placeholder)
            MD
          fi
      - name: Upload Stage 6 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage6-model-dataset-cards
          path: |
            ${ARTIFACT_DIR}/model_card.md
            ${ARTIFACT_DIR}/dataset_card.md

  # ---------------------------------------------
  # Stage 7 – Governance & Incident Response
  # ---------------------------------------------
  stage_7:
    name: 7) Governance & Incident
    runs-on: ubuntu-latest
    needs: [ stage_6 ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate governance & incident plans
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          cat > "${ARTIFACT_DIR}/governance_gates.md" << 'MD'
          # Governance Gates
          - Gate definitions, approvals, audits (placeholder)
          MD
          cat > "${ARTIFACT_DIR}/incident_response_plan.md" << 'MD'
          # Incident Response Plan
          - Detection, triage, comms, post-mortem (placeholder)
          MD
      - name: Upload Stage 7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage7-governance-incident
          path: |
            ${ARTIFACT_DIR}/governance_gates.md
            ${ARTIFACT_DIR}/incident_response_plan.md

  # ---------------------------------------------
  # Stage 8 – Rollen & Pflichten
  # ---------------------------------------------
  stage_8:
    name: 8) Rollen & Pflichten
    runs-on: ubuntu-latest
    needs: [ stage_7 ]
    steps:
      - uses: actions/checkout@v4
      - name: Generate roles & responsibilities
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          cat > "${ARTIFACT_DIR}/roles_responsibilities.md" << 'MD'
          # Rollen & Pflichten
          - RACI, approvals, segregation of duties (placeholder)
          MD
      - name: Upload Stage 8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage8-roles-responsibilities
          path: ${ARTIFACT_DIR}/roles_responsibilities.md

  # ---------------------------------------------
  # Stage 9 – Integrity Hashes (alle Artefakte)
  # ---------------------------------------------
  stage_9:
    name: 9) Integrity Hashes
    runs-on: ubuntu-latest
    needs: [ stage_8 ]
    steps:
      - uses: actions/checkout@v4
      - name: Recreate artifacts folder
        run: mkdir -p "${ARTIFACT_DIR}"

      - name: Download all previous artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Consolidate artifacts
        run: |
          # Kopiere alles in ein einheitliches Verzeichnis
          rsync -a downloaded/ "${ARTIFACT_DIR}/"
          ls -R "${ARTIFACT_DIR}"

      - name: Create INTEGRITY_MANIFEST.md and .json (SHA-256)
        run: |
          pushd "${ARTIFACT_DIR}" >/dev/null
          # Hashliste als MD
          echo "# Integrity Manifest (SHA-256)" > INTEGRITY_MANIFEST.md
          echo "" >> INTEGRITY_MANIFEST.md
          # Hashliste als JSON
          echo "{" > INTEGRITY_MANIFEST.json
          first=1
          for f in $(find . -type f | sort); do
            sum=$(sha256sum "$f" | awk '{print $1}')
            echo "- \`$f\`: \`$sum\`" >> INTEGRITY_MANIFEST.md
            if [ $first -eq 0 ]; then echo "," >> INTEGRITY_MANIFEST.json; fi
            printf "  \"%s\": \"%s\"" "$f" "$sum" >> INTEGRITY_MANIFEST.json
            first=0
          done
          echo "" >> INTEGRITY_MANIFEST.md
          echo "}" >> INTEGRITY_MANIFEST.json
          popd >/dev/null

      - name: Upload Stage 9 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage9-integrity
          path: |
            ${ARTIFACT_DIR}/INTEGRITY_MANIFEST.md
            ${ARTIFACT_DIR}/INTEGRITY_MANIFEST.json

  # ---------------------------------------------------------
  # Stage 10 – Compliance Summary (Status + offene Gates)
  # ---------------------------------------------------------
  stage_10:
    name: 10) Compliance Summary
    runs-on: ubuntu-latest
    needs: [ stage_9 ]
    steps:
      - uses: actions/checkout@v4

      - name: Download integrity & collect status
        uses: actions/download-artifact@v4
        with:
          name: stage9-integrity
          path: integrity

      - name: Build COMPLIANCE_SUMMARY.md
        env:
          RUN_CONCLUSION: ${{ needs.stage_3b.result }}
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          STATUS="PASS"
          if [ "${RUN_CONCLUSION}" = "failure" ]; then STATUS="FAIL"; fi

          OPEN_GATES=""
          # Beispiel: Wenn Bias failt, Gate 'Fairness' offen
          if [ "${RUN_CONCLUSION}" = "failure" ]; then
            OPEN_GATES="- Fairness Gate\n"
          fi

          cat > "${ARTIFACT_DIR}/COMPLIANCE_SUMMARY.md" << MD
          # Compliance Summary
          - Status: ${STATUS}
          - Open Gates:
          ${OPEN_GATES:-- None}
          - Included artifacts: see INTEGRITY_MANIFEST.*
          MD
      - name: Upload Stage 10 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage10-compliance-summary
          path: ${ARTIFACT_DIR}/COMPLIANCE_SUMMARY.md

